name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer

      # RVCNativePackage の swift-tools-version を 6.0 に調整
      - name: Fix RVCNativePackage Swift Tools Version
        run: |
          sed -i '' '1s/.*/\/\/ swift-tools-version: 6.0/' Demos/iOS/RVCNative/RVCNativePackage/Package.swift

      # mlx-swift をクローンし、Swift 6.0 互換の安定タグ（v0.18.0）にチェックアウト
      - name: Setup Submodules & Checkout Stable mlx-swift
        run: |
          cd Demos/iOS/RVCNative/Vendor
          rm -rf mlx-swift
          git clone --recursive https://github.com/ml-explore/mlx-swift.git mlx-swift
          cd mlx-swift
          # 安定版タグに切り替えて構文エラーを回避
          git checkout v0.18.0 || git checkout v0.16.0 || true
          git submodule update --init --recursive
          sed -i '' '1s/.*/\/\/ swift-tools-version: 6.0/' Package.swift

      - name: Build iOS App
        run: |
          cd Demos/iOS/RVCNative
          xcodebuild build \
            -workspace RVCNative.xcworkspace \
            -scheme RVCNative \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd Demos/iOS/RVCNative
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/RVCNative.app build/Payload/
          cd build
          zip -qr RVCNative_unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RVCNative_unsigned_ipa
          path: Demos/iOS/RVCNative/build/RVCNative_unsigned.ipa
