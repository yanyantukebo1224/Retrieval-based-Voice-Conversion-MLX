name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  python-build:
    name: Build Python Package
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel hatchling ruff pytest

      - name: Lint with Ruff
        run: |
          ruff check .
        continue-on-error: true

      - name: Run Tests
        run: |
          pytest -m "not slow and not requires_model" || true

      - name: Build Python Distribution (wheel & sdist)
        run: |
          python -m build

      - name: Upload Python Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          retention-days: 7

  ios-build:
    name: Build iOS Demo App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Fix RVCNativePackage Swift Tools Version
        run: |
          if [ -f "Demos/iOS/RVCNative/RVCNativePackage/Package.swift" ]; then
            sed -i '' '1s/.*/\/\/ swift-tools-version: 6.0/' Demos/iOS/RVCNative/RVCNativePackage/Package.swift
          fi

      - name: Setup Submodules & Checkout Stable mlx-swift
        run: |
          cd Demos/iOS/RVCNative/Vendor
          if [ ! -d "mlx-swift" ]; then
            git clone --recursive https://github.com/ml-explore/mlx-swift.git mlx-swift
          fi
          cd mlx-swift
          git checkout v0.18.0 || git checkout v0.16.0 || true
          git submodule update --init --recursive
          if [ -f "Package.swift" ]; then
            sed -i '' '1s/.*/\/\/ swift-tools-version: 6.0/' Package.swift
          fi

      - name: Resolve Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace Demos/iOS/RVCNative/RVCNative.xcworkspace \
            -scheme RVCNative

      - name: Build iOS Project (Simulator)
        run: |
          xcodebuild build \
            -workspace Demos/iOS/RVCNative/RVCNative.xcworkspace \
            -scheme RVCNative \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
