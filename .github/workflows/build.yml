name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  python-build:
    name: Build Python Package
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel hatchling ruff pytest

      - name: Lint with Ruff
        run: |
          ruff check .
        continue-on-error: true

      - name: Run Tests
        run: |
          pytest -m "not slow and not requires_model" || true

      - name: Build Python Distribution (wheel & sdist)
        run: |
          python -m build

      - name: Upload Python Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          retention-days: 7

  ios-build:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Fix RVCNativePackage Swift Tools Version
        run: |
          if [ -f "Demos/iOS/RVCNative/RVCNativePackage/Package.swift" ]; then
            sed -i '' '1s/.*/\/\/ swift-tools-version: 6.0/' Demos/iOS/RVCNative/RVCNativePackage/Package.swift
          fi

      - name: Setup Submodules & Fix mlx-swift Compatibility
        run: |
          cd Demos/iOS/RVCNative/Vendor
          rm -rf mlx-swift
          git clone --recursive https://github.com/ml-explore/mlx-swift.git mlx-swift
          cd mlx-swift
          git checkout 0.25.6 || git checkout 0.21.3 || git checkout main || true
          git submodule update --init --recursive
          if [ -f "Package.swift" ]; then
            sed -i '' '1s/.*/\/\/ swift-tools-version: 6.0/' Package.swift
          fi
          # Fix C++ std::allocator does not support const types error in custom_kernel.cpp
          find Source -name "custom_kernel.cpp" -exec sed -i '' 's/std::vector<const array>/std::vector<array>/g' {} + || true
          find Source -name "*.swift" -exec sed -i '' 's/target\.directoryURL/target\.directory/g' {} + || true

      - name: Resolve Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace Demos/iOS/RVCNative/RVCNative.xcworkspace \
            -scheme RVCNative

      - name: Build Unsigned iOS App
        run: |
          cd Demos/iOS/RVCNative
          xcodebuild build \
            -workspace RVCNative.xcworkspace \
            -scheme RVCNative \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          cd Demos/iOS/RVCNative
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/RVCNative.app build/Payload/
          cd build
          zip -qr RVCNative_unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RVCNative_unsigned_ipa
          path: Demos/iOS/RVCNative/build/RVCNative_unsigned.ipa
          retention-days: 7
